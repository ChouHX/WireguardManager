# 本地构建编排：在服务器/开发机上从源码编译前后端镜像，不依赖 GHCR。
#
#   docker compose -f docker-compose.build.yml up -d --build
#
# 需要发布到自己的 registry 时，把下面的 image 改成目标地址再 --push。
# 使用预构建镜像请回到默认文件：docker compose up -d
services:
  # Backend Service (Go + embedded SQLite)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # 本地构建产物打独立标签，避免与 GHCR 镜像混淆
    image: wireguardmanager-backend:local
    container_name: cloud-backend
    restart: unless-stopped
    # 需要管理 netns / iptables，必须使用宿主网络与特权
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./config.yaml:/root/config.yaml:ro
      - ./wg_config:/etc/wg_config
      # SQLite 数据目录（数据库文件由后端自动创建）
      - ${DATA_DIR:-./data}:/root/data
      - /lib/modules:/lib/modules:ro
      - /var/run/netns:/var/run/netns:shared
    environment:
      - TZ=Asia/Shanghai

  # Frontend Service (React 19 + Vite + MantineUI, served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 国内构建走镜像源；海外环境改为 https://registry.npmjs.org
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: wireguardmanager-frontend:local
    container_name: cloud-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    environment:
      # Nginx 反代的上游后端地址（backend 使用 host 网络）
      - BACKEND_UPSTREAM=http://host.docker.internal:8080
      - TZ=Asia/Shanghai
