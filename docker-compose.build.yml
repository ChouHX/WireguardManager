# WireGuard Manager —— 本地源码构建（不依赖 GHCR）
#
#   docker compose -f build.yml up -d --build
#
# 日常部署请使用默认的 compose.yml（拉取预构建镜像）。
# 两个文件的服务名与容器名一致，切换前先执行 docker compose down。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内构建走镜像源；海外环境改为 https://registry.npmjs.org
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
    # 本地构建产物打独立标签，避免与 GHCR 镜像混淆
    image: wireguardmanager:local
    container_name: cloud-app
    restart: unless-stopped
    # 需要管理宿主机的 netns / iptables / WireGuard 接口，必须使用宿主网络与特权
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./wg_config:/etc/wg_config
      # SQLite 数据目录（数据库文件由后端自动创建）
      - ${DATA_DIR:-./data}:/root/data
      - /lib/modules:/lib/modules:ro
      - /var/run/netns:/var/run/netns:shared
    environment:
      # 端口与数据目录可用 .env 覆盖；其余运行参数在管理界面「系统设置」中调整
      - WM_SERVER_PORT=${WM_SERVER_PORT:-3000}
      - WM_DB_PATH=/root/data/cloud_platform.db
      - WM_NETWORK_CONFIG_DIR=/etc/wg_config
      - WM_DEFAULT_ADMIN_EMAIL=${WM_DEFAULT_ADMIN_EMAIL:-admin@platform.com}
      - WM_DEFAULT_ADMIN_PASSWORD=${WM_DEFAULT_ADMIN_PASSWORD:-password}
      - WM_DEFAULT_ADMIN_NAME=${WM_DEFAULT_ADMIN_NAME:-admin}
      - TZ=${TZ:-Asia/Shanghai}
