# WireGuard Manager —— 本地源码构建（不依赖 GHCR）
#
#   docker compose -f docker-compose.build.yml up -d --build
#
# 日常部署请使用默认的 docker-compose.yml（拉取预构建镜像）。
# 两个文件的服务名与容器名一致，切换前先执行 docker compose down。
#
# 端口可用 WM_SERVER_PORT 覆盖，默认 3000：
#   WM_SERVER_PORT=8080 docker compose -f docker-compose.build.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内构建走镜像源；海外环境改为 https://registry.npmjs.org
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
    # 本地构建产物打独立标签，避免与 GHCR 镜像混淆
    image: wireguardmanager:local
    container_name: cloud-app
    restart: unless-stopped
    # 需要管理宿主机的 netns / iptables / WireGuard 接口，必须使用宿主网络与特权。
    #
    # privileged 不能换成「cap_add 精确授权」：只给 SYS_ADMIN + NET_ADMIN + SYS_MODULE
    # （即使再把 /var/run/netns 以 rshared 绑定挂载进去）时，ip netns add 依然会因为
    # Docker 的挂载传播锁定而失败：
    #     mount --make-shared /var/run/netns failed: Permission denied
    # 下面两项在特权模式下是冗余的，保留仅为说明本服务实际用到的能力范围。
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./wg_config:/etc/wg_config
      - ./data:/root/data
      - /lib/modules:/lib/modules:ro
      - /var/run/netns:/var/run/netns:shared
    environment:
      - WM_SERVER_PORT=${WM_SERVER_PORT:-3000}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M