# 单容器编排：一个进程同时提供控制台静态页与 API（后端直接托管前端产物）。
#
#   docker compose -f docker-compose.allinone.yml up -d            # 使用 GHCR 镜像
#   docker compose -f docker-compose.allinone.yml up -d --build    # 本地源码构建
#
# 与双容器方案相比：没有第二个容器、没有 Nginx 反代、没有 host.docker.internal，
# 只有一个端口。停止信号由 Go 进程直接处理，关闭过程是优雅的。
services:
  app:
    image: ghcr.io/chouhx/wireguardmanager-allinone:${WM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.allinone
      args:
        # 国内构建走镜像源；海外环境改为 https://registry.npmjs.org
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: cloud-app
    restart: unless-stopped
    # 需要管理宿主机的 netns / iptables / WireGuard 接口，必须使用宿主网络与特权
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./config.yaml:/root/config.yaml:ro
      - ./wg_config:/etc/wg_config
      # SQLite 数据目录（数据库文件由后端自动创建）
      - ${DATA_DIR:-./data}:/root/data
      - /lib/modules:/lib/modules:ro
      - /var/run/netns:/var/run/netns:shared
    environment:
      # 控制台与 API 共用此端口。也可改 config.yaml 的 server.port，
      # 但环境变量优先级更高，容器部署建议统一用这里。
      - WM_SERVER_PORT=${WM_SERVER_PORT:-3000}
      - TZ=Asia/Shanghai
