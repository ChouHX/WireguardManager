name: Build Windows Client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/build-windows-client.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: Management server URL (defaults to repository WGM_SERVER_URL variable)
        required: false
        type: string
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/build-windows-client.yml'

permissions:
  contents: read

jobs:
  client:
    runs-on: windows-latest
    env:
      WGM_SERVER_URL: ${{ inputs.server_url || vars.WGM_SERVER_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - name: Build frontend
        run: |
          npm --prefix client/frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix client/frontend run build
      - name: Test client, DPAPI and native Windows firewall/NAT lifecycle
        working-directory: client
        env:
          WGM_TEST_WINDOWS_NETWORK: '1'
        run: go test -v ./cloud ./service
      - name: Build and verify embedded driver and administrator manifest
        working-directory: client
        run: go run ./tools/package
      - name: Run packaged driver self-check on Windows
        working-directory: client
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'wgm-driver-check.json'
          $process = Start-Process -FilePath '.\build\bin\WireguardManagerDesktop.exe' -ArgumentList @('--check-driver', $report) -PassThru
          if (-not $process.WaitForExit(45000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged driver self-check timed out'
          }
          if (-not (Test-Path $report)) { throw 'Packaged driver self-check did not create a report' }
          Get-Content $report
          if ($process.ExitCode -ne 0) { throw "Packaged driver self-check failed: $($process.ExitCode)" }
          $check = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $check.apiCallable -or $check.resourceBytes -le 0) { throw 'Embedded driver is not callable' }
          $expectedServer = $env:WGM_SERVER_URL.Trim().TrimEnd('/') -creplace '/api$', ''
          if ($check.serverURL -ne $expectedServer) { throw 'Embedded management server URL does not match build configuration' }
      - name: Verify packaged application icon and native tray lifecycle
        working-directory: client
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'wgm-shell-check.json'
          $process = Start-Process -FilePath '.\build\bin\WireguardManagerDesktop.exe' -ArgumentList @('--check-shell', $report) -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged shell self-check timed out'
          }
          if (-not (Test-Path $report)) { throw 'Shell self-check did not create a report' }
          Get-Content $report
          $check = Get-Content $report -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $check.iconLoaded -or -not $check.trayReady -or -not $check.trayStopped) { throw 'Packaged icon or tray lifecycle check failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: WireguardManagerDesktop-windows-amd64
          path: |
            client/build/bin/WireguardManagerDesktop-windows-amd64.zip
            client/build/bin/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
