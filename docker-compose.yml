services:
  # Backend Service (Go + embedded SQLite)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cloud-backend
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./config.yaml:/root/config.yaml:ro
      - ./wg_config:/etc/wg_config
      # SQLite 数据目录（数据库文件由后端自动创建）
      - ${DATA_DIR:-./data}:/root/data
      - /lib/modules:/lib/modules:ro
      - /var/run/netns:/var/run/netns:shared
    environment:
      - TZ=Asia/Shanghai

  # Frontend Service (React 19 + Vite + MantineUI, served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 国内构建默认走镜像源；海外环境改为 https://registry.npmjs.org
        - NPM_REGISTRY=https://registry.npmmirror.com
    container_name: cloud-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    environment:
      # Nginx 反代的上游后端地址（backend 使用 host 网络）
      - BACKEND_UPSTREAM=http://host.docker.internal:8080
      - TZ=Asia/Shanghai
