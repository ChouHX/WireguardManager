# WireGuard Manager —— 默认部署：拉取 GHCR 上由 CI 构建的镜像
#
#   docker compose up -d                          启动
#   docker compose pull && docker compose up -d   更新到最新镜像
#   docker compose -f docker-compose.build.yml up -d --build   本地源码构建
#
# 无需任何配置文件：端口默认 3000，数据库写入 ./data，
# JWT 密钥首次启动自动生成并保存到 ./data/jwt.secret，
# 网络、监控、在线判定等参数在管理界面「系统设置」中调整。
#
# 指定端口（三选一）：
#   1. 临时指定：WM_SERVER_PORT=8080 docker compose up -d
#   2. 写进 .env：echo "WM_SERVER_PORT=8080" >> .env
#   3. 改本文件：把下面的 ${WM_SERVER_PORT:-3000} 换成 8080
#
# 其它调整：数据/配置目录改下面冒号左侧；回滚镜像版本改 image 的标签。
services:
  app:
    image: ghcr.io/chouhx/wireguardmanager:${WM_IMAGE_TAG:-latest}
    container_name: cloud-app
    restart: unless-stopped
    # 需要管理宿主机的 netns / iptables / WireGuard 接口，必须使用宿主网络与特权。
    #
    # 关于 privileged：这里不能用「cap_add 精确授权」来替代，实测确认过——
    # 只给 SYS_ADMIN + NET_ADMIN + SYS_MODULE（即使再把 /var/run/netns 以 rshared
    # 绑定挂载进去）时，ip netns add 依然失败：
    #     mount --make-shared /var/run/netns failed: Permission denied
    # 原因是 Docker 会给容器的挂载加上传播锁定，内核层面禁止改动挂载传播属性，
    # 仅凭 CAP_SYS_ADMIN 无法绕过。下列 cap_add 在特权模式下确属冗余，
    # 但保留它们对外无副作用，也便于阅读者了解本服务实际用到的能力范围。
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      # 账号的 WireGuard 配置（对应后端默认的 network.config_dir）
      - ./wg_config:/etc/wg_config
      # 数据目录：SQLite 数据库与自动生成的 jwt.secret
      # （容器内路径固定为 /root/data，与后端默认值一致）
      - ./data:/root/data
      - /lib/modules:/lib/modules:ro
      - /var/run/netns:/var/run/netns:shared
    environment:
      # 只暴露端口这一项：默认 3000，需要时用环境变量覆盖
      - WM_SERVER_PORT=${WM_SERVER_PORT:-3000}
    # 日志轮转：默认的 json-file 驱动不限制大小，长期运行会把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 资源上限：容器以特权模式运行，一旦异常失控会直接影响宿主机，
    # 因此给出上限作为兜底（内存按需调整）。
    deploy:
      resources:
        limits:
          memory: 512M